services:
  cbt:
    build: .
    container_name: cbt-man
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: file:/app/data/cbt.db
      SEED_DEMO: "${SEED_DEMO:-false}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-true}"
    volumes:
      - cbt-data:/app/data
    ports:
      - "10.0.0.8:1215:8080"

volumes:
  cbt-data:
